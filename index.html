  .field.advice .flabel { color: var(--good); }

  .card .links { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line); display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; font-size:12px; }

  .card .links a { color: var(--accent); text-decoration: none; }
  .card .links a:hover { text-decoration: underline; }
  .card a { color: var(--accent); text-decoration: none; }
  .card a:hover { text-decoration: underline; }

  .htmlsec p { margin-bottom: 8px; }
  .htmlsec blockquote { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; margin: 8px 0; color: var(--text3); font-size: 13px; }

  footer { margin-top: 40px; color: var(--text3); font-size: 12px; border-top: 1px solid var(--line); padding-top: 16px; }

                         {
                             "title":  "五、一句话结论（给管理层/产品线的五个判断）",
                             "html":  "\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e1.\u003c/span\u003e\u003cstrong\u003e平台寿命 \u0026gt; 平台换代\u003c/strong\u003e：DDR5 仍在高位、CPU 三连涨的当下，\"换 U 不换板\"是唯一能打的增量故事。技嘉已经用一张 BIOS 名单抢了先手，我方必须在 1–2 周内给出对等或更宽（含 Z690/B660）的兼容承诺，否则这波存量换 U 需求会全部流给对手。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e2.\u003c/span\u003e\u003cstrong\u003eDDR4 省钱逻辑正在失效\u003c/strong\u003e：DDR4 三个月涨幅（+24%）反超 DDR5（+20%），DDR4 SKU 的\"便宜\"卖点必须重新定价与重新备货，否则会同时踩中\"卖不动\"和\"渠道压货\"两个坑。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e3.\u003c/span\u003e\u003cstrong\u003e高端超频板的天花板已现\u003c/strong\u003e：800 美元级 X870 超频板被权威评测质疑定价（对比 X870E 对手），叠加内存天价，高端 SKU 的立项与价格带需要收敛；把资源转到主流段的内存兼容性、M.2 温控与售后体验，回报率更高。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e4.\u003c/span\u003e\u003cstrong\u003e整机预算的\"第四条成本曲线\"已经形成\u003c/strong\u003e：内存（+20~24%/3 个月）→ CPU（+10~20%）→ 显卡（GDDR6 涨价）→ 显示器（面板调价函 + 电竞屏均价同比 +7%），四条线同时上行。\u003cstrong\u003e主板是唯一还没明显涨价的一环\u003c/strong\u003e——这既是机会（用\"最不涨\"锚定价值、做套装），也是风险（渠道会拿主板做让利换量，进一步压毛利）。显示侧的应对是把它变成搭配卖点：双模 OLED/Mini LED 普及后，\"一台屏 + 一台好主板\"就能覆盖高刷与高分辨率，整机方案里把接口兼容（DP 2.1/HDMI 2.1/USB-C 96W）写清楚即可。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e5.\u003c/span\u003e\u003cstrong\u003e光追从\"画质选项\"变成了\"硬件门槛\"，这是本轮最强的换机催化剂\u003c/strong\u003e：《战争机器：事变日》把硬件光追做成关不掉的常开项，GTX 10 系及更早显卡直接进不去——这把一部分用户的决策从\"等 DDR5 降价\"改成了\"必须换平台\"。同时实测显示 CPU 占用 80–90%、内存占用 16–20GB，\u003cstrong\u003e瓶颈已经落在 CPU 与内存子系统上\u003c/strong\u003e，这正是主板价值最好讲的地方。建议：① 做\"光追门槛自查\"渠道工具，把老卡用户直接导向主板+CPU+内存套装；② 物料主推\"32GB 起 + 低延迟预设\"，用真实占用数据支撑；③ 与《奇点灰烬 II》（11/10）这类多核吃满的作品联动，强化\"换 U 就能续命\"的叙事。另外注意分层：窗口内《爆矢枪 2》《太吾异世劫》门槛极低（GTX 1650 / UHD 770 即可），说明 PC 市场正按硬件门槛分裂成两极，产品与话术要分开做。\u003c/div\u003e"
                         },

                             "title":  "今日结论",
                             "html":  "\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e1.\u003c/span\u003e\u003cstrong\u003e主板厂的窗口动作只有一条，但信息量足\u003c/strong\u003e：七彩虹 X870E ULTRA-S V14 以 1899 元把 16+2+1 相/80A/5×M.2/Debug 数显堆满，并把「X3D AI 高帧模式」做成 BIOS 一键预设。这不是单点新品，是价格锚点重设——同价位竞品的定价空间被压缩，且「会不会替 X3D 用户调参」开始成为选购标准。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e2.\u003c/span\u003e\u003cstrong\u003e成本侧出现了第一个「需求妥协」信号\u003c/strong\u003e：微软提组合式内存、Meta 用 CXL 复用退役 DDR4。买方开始改架构而非单纯接受涨价，这是涨价周期进入后半段的典型特征。但供给侧的加杠杆（SK 海力士 2 万亿韩元）说明顶部不会马上到——两股力量对撞的结果是「高价平台期拉长」，而不是快速回落。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e3.\u003c/span\u003e\u003cstrong\u003e涨价已经进零售价签\u003c/strong\u003e：荣耀千元档机型上调 500 元（+25%）。DIY 端的传导路径是「内存先涨 → 整机预算被吃 → 主板不敢涨」，Q4 主板促销必须走套装锁价，单卖会越来越难成交。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e4.\u003c/span\u003e\u003cstrong\u003e本地 AI 装机的门槛从「多卡」降到「大内存」\u003c/strong\u003e：Ryzen AI Halo 128GB 统一内存的实测证明它能跑消费级显卡跑不动的模型。这对小体积整机/迷你主机是结构性机会，也意味着 128GB/192GB 套条的内存兼容性要从「发烧项」升级为「必测项」。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e5.\u003c/span\u003e\u003cstrong\u003e光互联 24 小时内三连（微软架构 / 三星代工 / 英伟达封装）\u003c/strong\u003e：短期不影响任何消费级产品，但它决定了 2028 年后「主板还需不需要那么多 DIMM 槽」。今年不投入，但产品叙事要从「槽位数量」转向「带宽与延迟」。\u003c/div\u003e"
                         },

                             "html":  "\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e1.\u003c/span\u003e\u003cstrong\u003e本期最重要的不是「又涨 15%」，而是「订单被撕」\u003c/strong\u003e。DDR5 供应商单方面取消已确认订单，意味着买卖双方的力量对比彻底翻转，报价有效期与合同约束力同时失效。主板厂要立刻做三件事：缩短套装报价有效期、盘点已锁价订单的敞口、把「分批交付」的预期提前告知渠道。这三件事比任何新品都紧急。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e2.\u003c/span\u003e\u003cstrong\u003e短缺的时间轴被拉到 2027 年\u003c/strong\u003e。戴尔 CEO 的表态 + 集邦的 20% 环比预估，共同指向「高价平台期拉长」而非快速回落。但集邦的 80%→40%→20% 说明涨速在收敛，二阶导已转负——这意味着 Q4 是「最后一波猛涨」，2027H1 更可能是「价格不跌、需求疲软」的难受阶段，促销预算要按这个设计。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e3.\u003c/span\u003e\u003cstrong\u003e主板在整机叙事里被外部厂商重新定义\u003c/strong\u003e。TCOMAS 用「主板微景观」冷头把主板变成视觉主角，乔思伯用 299 元的副屏把机箱内部变成展示面。这两件事都在说同一句话：主板的「被看见」价值在上升，但变现的是别人。主板厂要么自己做外观件与数据接口，要么开放授权拿分成，不能继续只卖一块藏在冷头后面的板子。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e4.\u003c/span\u003e\u003cstrong\u003e入门装机的基本盘在松动\u003c/strong\u003e。RTX 6060 可能拖到 2029、下一代 Xbox 可能卖到 1200 美元——两件事从相反方向挤压「入门 DIY」：一边是新卡缺位，一边是主机不再便宜。短期看是需求被压制，中期看是「核显 + FSR 4.1」撑起低预算市场。入门板的配置思路要从「等新卡」转向「核显优先」，视频输出与内存兼容性比显卡槽位更重要。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e5.\u003c/span\u003e\u003cstrong\u003e软件层的免费性能正在变成售后风险\u003c/strong\u003e。免刷写 VBIOS 工具、DLSS 预设实时切换工具，都是把原本需要「改固件」的操作变成「驱动层临时改」。这对用户的体验是好事，对厂端的保修判责是麻烦。建议售后体系先补「隐性超频」的检测口径，再谈响应速度——判责错了，响应再快也是亏。\u003c/div\u003e"

                             "title":  "今日结论",
                             "html":  "\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e1.\u003c/span\u003e\u003cstrong\u003e平台换代的时间轴第一次被两件事同时确认\u003c/strong\u003e：技嘉注册 20+ 款 Z990（新平台报备完成），华擎 Z890 Taichi AQUA 被评测并直言「LGA1851 已在暮年」（旧平台收官）。这两条拼起来，2026 年 11 月至 2027 年 1 月就是「清库存」与「预热」重叠的三个月。主板厂现在要做的不是等新平台，而是把这两个动作的预算与话术分开——清库存讲性价比，预热讲差异化，混在一起两头都不讨好。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e2.\u003c/span\u003e\u003cstrong\u003e整机价格倒挂是比颗粒涨价更危险的信号\u003c/strong\u003e。539 美元送 32GB DDR5-5600 的整机意味着整机厂在用涨价前的库存成本打新价格，零售主板被拖进了一场「跟整机比价」的战争。单纯的主板降价没有意义，因为用户比的是整机总价。可行的做法只有两条：要么释放自己的早期锁价库存做套装，要么把比价维度拉回主板本身（接口、供电、BIOS、支持周期）。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e3.\u003c/span\u003e\u003cstrong\u003e调校入口正在系统性外移，BIOS 的护城河要重写\u003c/strong\u003e。AMD 把 PPT/TDC/EDC 搬到 Linux 系统内，加上此前的免刷写 VBIOS 与 DLSS 预设工具，趋势很清楚：参数可调不再是卖点。BIOS 团队的价值要转到「经过验证的预设、够广的 QVL、失败可回滚、支持周期可查」——本期第 23 条（Surface 承诺六年驱动支持）恰好提供了一个可抄的模板：把支持周期变成规格表上的一行。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e4.\u003c/span\u003e\u003cstrong\u003e内存贵，产品矩阵就该按「条数」而不是「价位」切分\u003c/strong\u003e。技嘉的 1DPC 超频强化款、华擎的 4 DIMM 256GB 与 DDR5-9600 OC，看似两个方向，实际是同一个市场事实的两面：用户要么买 2 条求高频，要么买 4 条求容量。Z990 时代如果还用「入门/主流/旗舰」三层来规划，会切不准需求；应该明确给出「2 条满速」和「4 条大容量」两条产品线，并各自给可验证的 QVL 承诺。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e5.\u003c/span\u003e\u003cstrong\u003e「门槛化」正在从显卡蔓延到显示器，整机搭售要重做准入清单\u003c/strong\u003e。《使命召唤：现代战争 4》要求 120Hz + VRR 才能开性能模式，这是显示器第一次被写进游戏硬门槛。整机方案里「标称 165Hz」已经不够，必须按 VRR 实测来选屏，否则用户会觉得「性能模式没用」，售后成本远高于省下的显示器差价。\u003c/div\u003e"

                             "html":  "\u003cdiv class=\"todo-item\"\u003e技嘉 Z990 之后，华硕、微星是否跟进注册——三家齐了才算平台换代正式启动。\u003c/div\u003e\u003cdiv class=\"todo-item\"\u003eZ890 旗舰在国内是否跟随「半价清库存」：盯双十一华擎/技嘉/微星的 Z890 高端板到手价。\u003c/div\u003e\u003cdiv class=\"todo-item\"\u003e美光 DDR6 的首个平台支持时间与送样节点：决定 2027-2028 主板布线预研的启动时点。\u003c/div\u003e\u003cdiv class=\"todo-item\"\u003eAMD AOD 补丁是否被 Linux 内核合入；若合入，主板选型叙事需补「固件与驱动配合度」。\u003c/div\u003e\u003cdiv class=\"todo-item\"\u003e三星西安 286 层 V9 的 12 月产能兑现情况：直接影响 2027Q1 SSD 价格与 M.2 槽位策略。\u003c/div\u003e\u003cdiv class=\"todo-item\"\u003e《使命召唤：现代战争 4》VRR 实测名单：哪些显示器能在性能模式下真正跑满，作为整机搭售准入依据。\u003c/div\u003e\u003cdiv class=\"todo-item\"\u003e微软对 Xbox 收购传闻的后续措辞：若转为「战略评估」，跨平台权益叙事要提前下架。\u003c/div\u003e\u003cdiv class=\"todo-item\"\u003e显示器面板厂 11 月报价函（本期窗口内无新面板价格信息，已直连 IT之家与快科技核验）。\u003c/div\u003e\u003cdiv class=\"todo-item\"\u003eweb_search 仍 401（key ****72c3 invalid），需用户侧修复；修复前继续以 IT之家首页 + 电脑频道 + 快科技电脑频道 + TechPowerUp 直连为取数主干。\u003c/div\u003e"

                             "html":  "\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e1.\u003c/span\u003e\u003cstrong\u003e「内存贵」已经从成本问题升级为产品定义问题。\u003c/strong\u003e AMD 用 5800X3D 复产直接回应 DDR5 价格，微软用系统优化给 8GB 减负，两条动作方向一致：\u003cstrong\u003e延长旧平台寿命、降低容量门槛\u003c/strong\u003e。主板厂若还按「推新品、拉容量」的惯性做 2027 规划，会与用户实际支付能力脱节。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e2.\u003c/span\u003e\u003cstrong\u003e供给端的天花板被官方说破了。\u003c/strong\u003e 英特尔 CTO 给出「尖端晶圆最多两倍」的上限，Fab 62 量产要到 2028 年底，黄仁勋又否定 2029 年前的内存过剩——三条合起来，2027 全年没有宽松窗口。备料按紧做，二供三供按必须做。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e3.\u003c/span\u003e\u003cstrong\u003e显卡进入「越等越贵」阶段。\u003c/strong\u003e 5090/5080 传 2027 年 1 月停产，接棒的 5080 24GB 显存更大、TDP 415W、价格更高，而现款最后一批 10 月底到货、卖到感恩节。这对主板是明确的功能需求：415W 供电与 12V-2x6 走线必须按新常态验证。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e4.\u003c/span\u003e\u003cstrong\u003e虚拟货币这条线对 DIY 的影响，从「挖矿抢卡」变成了「算力资产重定价」。\u003c/strong\u003e 算力创七个月新高但币价在 ETF 成本线附近盘整，说明矿工没有大规模甩卖也没有暴利扩张；真正的变化是 GPU 寿命被官方口径拉到 8 年——\u003cstrong\u003e残值上升会同时削弱新卡与整机的换代冲动\u003c/strong\u003e，这与内存涨价造成的「延长旧平台寿命」是同向叠加。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e5.\u003c/span\u003e\u003cstrong\u003e供电安全是本期唯一可以立刻变现的工程机会。\u003c/strong\u003e 两天 7 张烧毁的 5090/4090 全在 12+4pin，连原装线也出事，而海盗船已经用逐针过流保护给出正解。主板厂做插到位检测、单针电流监控、与电源联动告警，是低成本高感知的差异化。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e6.\u003c/span\u003e\u003cstrong\u003e「珍珠币」Pearl 是本期最需要冷静看待的一条线。\u003c/strong\u003e 它的机制货真价实（挖矿即矩阵乘法、有论文与合作方端点），一个月 228%、市值 7.7 亿美元也说明需求真实存在；但假数据可挖、推理额外开销 10—15%、12 个月增发近乎翻倍、流动性集中在两三家小交易所，四条风险同样明确。结论是：\u003cstrong\u003e把它当作「二手卡定价的新变量」和「AI 长时负载的产品验证场景」，不要当作产能规划依据\u003c/strong\u003e。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e7.\u003c/span\u003e\u003cstrong\u003e主板的天花板已经被「整机装不装得起」决定，而不再是主板自己。\u003c/strong\u003e Q3 全球 PC 出货 -21%、Q4 预计 -27%，DRAM 与 SSD 占 BOM 从 15% 冲到近 40%，同期显卡缺货与新品排产无望——三条叠加的结果是：\u003cstrong\u003e装机需求从「换新」退化为「升级 + 替换」\u003c/strong\u003e。因此从本期起常设「关联配件与连带销售」分区，凡内存/SSD/电源/机箱/散热/显示/整机/渠道的价格与节奏变化一律纳入判断；Q4 的排产、备料与渠道政策都按 -27% 情景执行，主推方向切到「老平台升级件 + 核显过渡装机」这两条还有真实支付意愿的路径。\u003c/div\u003e"

                             "html":  "\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e1.\u003c/span\u003e\u003cstrong\u003e本期最重要的不是涨价，是涨价把需求打死了\u003c/strong\u003e。内存出厂价还在涨、渠道却降价割肉，销量掉 20%–30%；RTX 5080 涨 5000 元后商家「懒得统计销量」。两条独立信源指向同一件事：价格已经越过终端承受线，成交归零。这意味着接下来的风险不是「贵」，是「没人买」。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e2.\u003c/span\u003e\u003cstrong\u003e主板线本期有真实产品力证据：一次 BIOS 更新让 9800X3D 从 95℃ 降到 86℃\u003c/strong\u003e。9℃ 的差距完全由固件决定，这是高端主板在存储涨价年份仍能卖动的核心原因。AGESA 跟进速度、BIOS 更新节奏，今年比堆供电更能决定口碑。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e3.\u003c/span\u003e\u003cstrong\u003e需求外流有了具体去处：网吧门店从 7.7 万家回到 12.26 万家\u003c/strong\u003e。用户不是不玩游戏，是把「买断」换成「按次」。零售 DIY 的萎缩有一部分是结构性的，而网咖/电竞馆的批量采购是今年少数还在增长的 B 端需求——渠道重心应该往这边挪。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e4.\u003c/span\u003e\u003cstrong\u003eHBM 的虹吸已经从「价格」升级到「改设计」\u003c/strong\u003e。英伟达为等 HBM4 把 Vera Rubin 带宽从 44TB/s 降到 38.5TB/s，加上三星 HBM 溢价 25% 仍被抢购，2027 年消费级 DDR5 的紧平衡没有缓解路径。备料模型按「不回落」建。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e5.\u003c/span\u003e\u003cstrong\u003e平台侧的时间表被 OS 钉紧了\u003c/strong\u003e：Windows 11 预览版已实装 APX 支持，明确为 2027 年初 Nova Lake 铺路，且 AVX-512 要下放到能效核、最高 52 核。下一代主板的供电与散热验证必须按「全核 AVX-512 满载」做，不能再按老经验省料。\u003c/div\u003e\u003cdiv class=\"ol-item\"\u003e\u003cspan class=\"ol-num\"\u003e6.\u003c/span\u003e\u003cstrong\u003e双十一的正确打法是「接住捡漏 + 卖容量」，不是推新平台\u003c/strong\u003e。渠道在割肉清库存，这是短期唯一的价格洼地；同时《影之刃零》10-29 发售（145GB、GTX 1660 可玩）带来的是加盘加内存需求。把 SSD 加装 + 内存升级做成主促销，比推 Z890/X870 新平台更贴合当前用户决策。\u003c/div\u003e"

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 正文内联 markdown：链接 [文字](url) + 粗体 **文字**（先 esc 再转）
function mdInline(s) {
  let t = esc(s);
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)\]]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  return t;
}

function renderLinks(links) {
  const box = el('div','links');
  box.appendChild(el('span','l-label','出处：'));
  links.forEach(l => {
    const a = el('a', null, esc(l.text || '来源'));
    a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    box.appendChild(a);
  });
  return box;
}

function renderField(label, text, cls) {
  const d = el('div', 'field ' + cls);
  d.appendChild(el('span','flabel', label));
  d.appendChild(el('span','fbody', mdInline(text)));
  return d;
}

function renderItem(it) {
  const card = el('div', 'card');
  card.appendChild(el('div','title', esc(it.title)));
  (it.facts || []).forEach(f => {
    if (f.indexOf('【时间】') === 0) {
      const d = el('div','fact time');
      d.appendChild(el('span','tlabel','时间'));
      d.appendChild(el('span', null, mdInline(f.slice(4))));
      card.appendChild(d);
    } else {
      card.appendChild(el('div','fact', mdInline(f)));
    }
  });
  if (it.why) card.appendChild(renderField('为什么重要', it.why, 'why'));
  if (it.advice) card.appendChild(renderField('我方动作建议', it.advice, 'advice'));
  if (it.credibility) card.appendChild(renderField('可信度分级', it.credibility, 'cred'));
  if (it.table_html) {
    const w = el('div','tablewrap');
    w.innerHTML = it.table_html;
    card.appendChild(w);
  }
  if (it.source_note) card.appendChild(el('div','srcnote', esc(it.source_note)));
  if (it.links && it.links.length) card.appendChild(renderLinks(it.links));
  return card;
}

function renderSection(sec) {
  const s = el('section','section');
  const head = el('div','sec-head');
  head.appendChild(el('span','dot'));
  head.appendChild(el('h2', null, esc(sec.title)));

  if (sec.items && sec.items.length) {
    head.appendChild(el('span','n', sec.items.length + ' 条'));
    s.appendChild(head);
    const grid = el('div','grid');
    sec.items.forEach(it => grid.appendChild(renderItem(it)));
    s.appendChild(grid);
  } else if (sec.html) {
    head.appendChild(el('span','n','说明'));
    s.appendChild(head);
    const body = el('div','htmlsec');
    body.innerHTML = sec.html;
    s.appendChild(body);
  } else {
    return null;
  }
  return s;
}

function renderDay(d) {
  const frag = document.createDocumentFragment();
  (d.sections || []).forEach(sec => {
    const s = renderSection(sec);
    if (s) frag.appendChild(s);
  });
  return frag;
}

function showDay(d) {
  const c = document.getElementById('content');
  c.innerHTML = '';
  const box = el('div');
  if (d.window) box.appendChild(el('div','day-window', esc(d.window)));
  if (d.note) box.appendChild(el('div','day-note', esc(d.note)));
  box.appendChild(renderDay(d));
  c.appendChild(box);
}

function showAll() {
  const ds = window.DIGESTS || [];
  const c = document.getElementById('content');
  c.innerHTML = '';
  const box = el('div');
  ds.forEach(d => {
    box.appendChild(el('div','day-marker', esc(d.label || '')));
    if (d.window) box.appendChild(el('div','day-window', esc(d.window)));
    if (d.note) box.appendChild(el('div','day-note', esc(d.note)));
    box.appendChild(renderDay(d));
  });
  c.appendChild(box);
}

function render() {
  const ds = window.DIGESTS || [];
  const sw = document.getElementById('daySwitch');
  sw.innerHTML = '';

  const allBtn = el('button','btn day-tab active','全部');
  allBtn.onclick = () => {
    sw.querySelectorAll('.day-tab').forEach(x => x.classList.remove('active'));
    allBtn.classList.add('active');
    showAll();
  };
  sw.appendChild(allBtn);

  ds.forEach(d => {
    const b = el('button','btn day-tab', esc(d.label));
    b.onclick = () => {
      sw.querySelectorAll('.day-tab').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      showDay(d);
    };
    sw.appendChild(b);
  });

  showAll();
}
render();
